apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: secret
          mountPath: /etc/redis-auth
          readOnly: true
  volumes:
    - name: secret
      secret:
        secretName: redis-auth
        defaultMode: 0400