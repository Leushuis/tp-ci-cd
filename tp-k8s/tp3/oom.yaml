apiVersion: v1
kind: Pod
metadata:
  name: gourmand
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress", "--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
      resources:
        requests: { memory: "50Mi", cpu: "100m" }
        limits:   { memory: "100Mi", cpu: "500m" }