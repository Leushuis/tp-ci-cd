apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.1
          ports: [{ containerPort: 80 }]
          envFrom:
            - configMapRef: { name: api-config }
          readinessProbe:
            httpGet: { path: /health, port: 80 }