apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
namePrefix: prod-
resources:
  - ../../base
  - hpa.yaml
labels:
  - pairs:
      env: prod
replicas:
  - name: api
    count: 3
images:
  - name: traefik/whoami
    newTag: v1.10.2
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - WHOAMI_NAME=api-prod-v2
      - APP_ENV=prod
secretGenerator:
  - name: api-secret
    envs: [secret.env]
patches:
  - path: patch-resources.yaml
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value: ["--verbose"]