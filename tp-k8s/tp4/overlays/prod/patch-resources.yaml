apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: whoami
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef:    { name: api-secret }
          livenessProbe:
            httpGet: { path: /health, port: 80 }